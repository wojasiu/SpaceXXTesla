{% load static %}
<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt – Tesla</title>
    <link rel="stylesheet" href="{% static 'tesla.css' %}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">TESLA</div>
      <nav>
        <ul>
          <li><a href="{% url 'tesla-home' %}">Strona główna</a></li>
          <li><a href="{% url 'tesla-kontakt' %}">Kontakt</a></li>
          <li><a href="{% url 'tesla-onas' %}">O nas</a></li>
          <li><a href="{% url 'main' %}">Powrót</a></li>
        </ul>
      </nav>
      <div class="logo-right">
        <img src="{% static 'logo-tesla.png' %}" alt="Tesla logo" />
      </div>
    </header>
    <section class="contact-hero">
      <div class="contact-box animate">
        <h1>Skontaktuj się z nami</h1>
        <p><span>Email:</span> kontakt@tesla.pl</p>
        <p><span>Telefon:</span> +48 123 456 789</p>
        <p><span>Adres:</span> ul. Tesla 10, 12-123 Mars</p>
      </div>
    </section>
  </body>
</html>
